<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Бесплатный Редактор</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; }
        input, button { display: block; width: 100%; margin: 20px 0; padding: 12px; border-radius: 5px; border: none; }
        button { background-color: #00bcd4; color: white; font-size: 16px; cursor: pointer; }
        #status { color: #ffa502; margin: 15px 0; }
        img { max-width: 100%; border-radius: 5px; display: none; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>ИИ Без Цензуры (Бесплатно)</h2>
    <input type="file" id="imageInput" accept="image/*">
    <button id="processBtn" onclick="processImage()">Запустить обработку</button>
    <div id="status"></div>
    <img id="resultImage" alt="Результат">
</div>

<script>
    // ВСТАВЬТЕ СЮДА ВАШ ТОКЕН С HUGGING FACE
    const HF_TOKEN = "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"; 

    async function processImage() {
        const fileInput = document.getElementById('imageInput');
        const statusDiv = document.getElementById('status');
        const resultImg = document.getElementById('resultImage');
        const btn = document.getElementById('processBtn');

        if (!fileInput.files || fileInput.files.length === 0) {
            alert('Выберите файл фотографии!');
            return;
        }

        btn.disabled = true;
        statusDiv.innerText = "⏳ Отправка на бесплатный сервер Hugging Face... Это займет 10-30 секунд.";
        resultImg.style.display = 'none';

        try {
            const file = fileInput.files[0];

            // Отправляем запрос на нецензурированную модель SDXL-Inpaint, развернутую на Hugging Face
            const response = await fetch(
                "https://huggingface.co",
                {
                    headers: { 
                        "Authorization": `Bearer ${HF_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    method: "POST",
                    body: JSON.stringify({
                        inputs: "naked body, highly detailed, realistic skin texture, photorealistic",
                        parameters: {
                            negative_prompt: "clothes, underwear, bra, panties, fabric, blurry, bad anatomy",
                            denoising_strength: 0.85
                        }
                    }),
                }
            );

            if (!response.ok) throw new Error("Сервер перегружен или токен неверен. Попробуйте еще раз.");

            const blob = await response.blob();
            const outputUrl = URL.createObjectURL(blob);
            
            resultImg.src = outputUrl;
            resultImg.style.display = 'block';
            statusDiv.innerText = "✨ Готово!";

        } catch (error) {
            statusDiv.innerText = `❌ Ошибка: ${error.message}`;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
