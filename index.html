<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Бесплатный Генератор</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; }
        input, button { display: block; width: 100%; margin: 20px 0; padding: 12px; border-radius: 5px; border: none; box-sizing: border-box; }
        input { background: #333; color: #fff; font-size: 16px; }
        button { background-color: #e91e63; color: white; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #555; }
        #status { color: #ffa502; margin: 15px 0; }
        img { max-width: 100%; border-radius: 5px; display: none; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>ИИ Генератор Без Цензуры (Pollinations)</h2>
    <p>Введите описание на английском</p>
    
    <input type="text" id="promptInput" value="1girl, naked body, flawless realistic skin, highly detailed, photorealistic">
    <button id="processBtn" onclick="generateArt()">Создать изображение</button>
    
    <div id="status"></div>
    <img id="resultImage" alt="Результат нейросети">
</div>

<script>
    function generateArt() {
        const promptInput = document.getElementById('promptInput');
        const statusDiv = document.getElementById('status');
        const resultImg = document.getElementById('resultImage');
        const btn = document.getElementById('processBtn');

        btn.disabled = true;
        statusDiv.innerText = "⏳ Нейросеть генерирует кадр... Пожалуйста, подождите.";
        resultImg.style.display = 'none';

        // 1. Кодируем текст промпта, чтобы в нём не ломались пробелы и запятые
        const encodedPrompt = encodeURIComponent(promptInput.value);
        
        // Добавляем отрицательные параметры прямо в конец ссылки для обхода одежды
        const negativeParams = encodeURIComponent(", clothes, underwear, bra, panties, fabric, blurry, bad anatomy");

        // 2. Строим прямую ссылку на ИИ-генератор. Параметр safe=false отключает NSFW цензуру.
        const imageUrl = `https://pollinations.ai{encodedPrompt}${negativeParams}?safe=false&width=512&height=512&nologo=true`;

        // 3. Скачиваем картинку через стандартный механизм браузера (img.src) — тут CORS не существует!
        resultImg.src = imageUrl;

        // Когда картинка полностью загрузится с сервера Pollinations — показываем её
        resultImg.onload = function() {
            resultImg.style.display = 'block';
            statusDiv.innerText = "✨ Изображение успешно сгенерировано!";
            btn.disabled = false;
        };

        // Если сервер выдаст сбой
        resultImg.onerror = function() {
            statusDiv.innerText = "❌ Ошибка загрузки. Попробуйте еще раз через пару секунд.";
            btn.disabled = false;
        };
    }
</script>

</body>
</html>
