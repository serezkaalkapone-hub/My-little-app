<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Генератор</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; }
        input, button { display: block; width: 100%; margin: 20px 0; padding: 12px; border-radius: 5px; border: none; box-sizing: border-box; }
        input { background: #333; color: #fff; font-size: 16px; }
        button { background-color: #e91e63; color: white; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #555; }
        #status { color: #ffa502; margin: 15px 0; }
        img { max-width: 100%; border-radius: 5px; display: none; margin-top: 20px; }
        .note { font-size: 12px; color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>ИИ Генератор Без Цензуры</h2>
    <p>Введите описание персонажа на английском</p>
    
    <input type="text" id="promptInput" value="1girl, naked body, flawless realistic skin, highly detailed, photorealistic">
    <button id="processBtn" onclick="generateArt()">Создать изображение</button>
    
    <div id="status"></div>
    <img id="resultImage" alt="Результат нейросети">
    <p class="note">Используется модель SDXL. Генерация может занять до 30 секунд.</p>
</div>

<script>
    // ВСТАВЬТЕ СЮДА ВАШ ТОКЕН С HUGGING FACE (hf_...)
    const HF_TOKEN = "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"; 

    // Модель для генерации (поддерживает NSFW при соответствующем промпте)
    const MODEL_URL = "https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0";

    async function generateArt() {
        const promptInput = document.getElementById('promptInput');
        const statusDiv = document.getElementById('status');
        const resultImg = document.getElementById('resultImage');
        const btn = document.getElementById('processBtn');

        // Базовая валидация
        if (!promptInput.value.trim()) {
            statusDiv.innerText = "⚠️ Введите описание!";
            return;
        }

        btn.disabled = true;
        statusDiv.innerText = "⏳ Нейросеть генерирует кадр... Это занимает около 15-30 секунд.";
        resultImg.style.display = 'none';

        try {
            const response = await fetch(
                MODEL_URL,
                {
                    headers: { 
                        "Authorization": `Bearer ${HF_TOKEN}`,
                        "Content-Type": "application/json",
                        "Accept": "image/png" // явно просим картинку
                    },
                    method: "POST",
                    body: JSON.stringify({
                        inputs: promptInput.value,
                        parameters: {
                            negative_prompt: "clothes, underwear, bra, panties, fabric, blurry, bad anatomy, deformed, low quality",
                            guidance_scale: 7.0,
                            num_inference_steps: 30  // увеличил для качества
                        }
                    }),
                }
            );

            if (!response.ok) {
                let errorMsg = `Ошибка сервера: ${response.status}`;
                if (response.status === 503) {
                    errorMsg = "Модель загружается на сервер Hugging Face. Подождите 1 минуту и попробуйте снова.";
                } else if (response.status === 401 || response.status === 403) {
                    errorMsg = "Неверный токен или нет доступа. Проверьте HF_TOKEN.";
                } else {
                    // Попробуем прочитать текстовый ответ (может быть JSON с деталями)
                    try {
                        const errorText = await response.text();
                        if (errorText) errorMsg += `: ${errorText}`;
                    } catch (_) {}
                }
                throw new Error(errorMsg);
            }

            // Получаем blob-картинку
            const blob = await response.blob();
            const outputUrl = URL.createObjectURL(blob);
            
            resultImg.src = outputUrl;
            resultImg.style.display = 'block';
            statusDiv.innerText = "✨ Изображение успешно сгенерировано!";

        } catch (error) {
            statusDiv.innerText = `❌ Ошибка: ${error.message}`;
            console.error(error);
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
